<app-navbar [pageTitle]="'Reset Credentials'">
  <div class="dashboard-container">

    <main class="main-content">
      <section class="content">
        <div class="container mt-3"> 
          <div class="card shadow-sm">
            <div class="card-body">
              <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
                <div class="mb-3">
                  <label for="new_password" class="form-label">New Password</label>
                  <input
                    type="password"
                    id="new_password"
                    formControlName="new_password"
                    class="form-control"
                    placeholder="Enter new password"
                  />
                  <div class="text-danger mt-1" *ngIf="passwordForm.get('new_password')?.touched && passwordForm.get('new_password')?.invalid">
                    <small *ngIf="passwordForm.get('new_password')?.errors?.['required']">New password is required.</small>
                    <small *ngIf="passwordForm.get('new_password')?.errors?.['minlength']">Minimum 8 characters required.</small>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="confirm_password" class="form-label">Confirm Password</label>
                  <input
                    type="password"
                    id="confirm_password"
                    formControlName="confirm_password"
                    class="form-control"
                    placeholder="Confirm your password"
                  />
                  <div class="text-danger mt-1" *ngIf="passwordForm.get('confirm_password')?.touched && passwordForm.get('confirm_password')?.invalid">
                    <small *ngIf="passwordForm.get('confirm_password')?.errors?.['required']">Confirm password is required.</small>
                  </div>
                </div>

                <div class="text-danger mb-3" *ngIf="passwordForm.errors?.['passwordMismatch'] && passwordForm.get('confirm_password')?.touched">
                  <small>Passwords do not match.</small>
                </div>

                <div class="button-container">
                  <button type="submit" class="btn btn-primary" [disabled]="passwordForm.invalid">
                    Update Password
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</app-navbar>
